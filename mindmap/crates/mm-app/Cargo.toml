[package]
name = "mm-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mm_app"
path = "src/lib.rs"

[[bin]]
name = "mindmap"
path = "src/main.rs"

[dependencies]
mm-core.workspace = true
mm-layout.workspace = true
mm-io.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
rfd = "0.15"
egui = "0.37"
