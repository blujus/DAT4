[workspace]
resolver = "2"
members = ["crates/mm-core", "crates/mm-layout", "crates/mm-io", "crates/mm-app", "crates/mm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
csv = "1"
proptest = "1"
mm-core = { path = "crates/mm-core" }
mm-layout = { path = "crates/mm-layout" }
mm-io = { path = "crates/mm-io" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
