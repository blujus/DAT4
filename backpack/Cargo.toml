[workspace]
resolver = "2"
members = [
    "crates/motorctl",
    "crates/reflex",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/blujus/DAT4"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = 1
