[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backpack"
version = "0.1.0"
description = "Python agentic cortex for the LEGO Mindstorms Raspberry Pi backpack"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.50",
]

[project.optional-dependencies]
camera = ["picamera2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
backpack = "backpack.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backpack*"]
